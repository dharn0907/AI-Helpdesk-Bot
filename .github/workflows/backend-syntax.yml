name: Backend Python Syntax

on:
  pull_request:
    paths:
      - "backend/**/*.py"
      - ".github/workflows/backend-syntax.yml"
  push:
    branches:
      - "fix/helpdesk-conversation-workflow-v2"
    paths:
      - "backend/**/*.py"
      - ".github/workflows/backend-syntax.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all backend Python files
        run: python -m compileall -q backend
